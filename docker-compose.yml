services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pos}
      POSTGRES_USER: ${POSTGRES_USER:-pos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pos}
    ports:
      - 5432:5432
    volumes:
      - pos-postgres-data:/var/lib/postgresql/data
      - ./apps/api/db/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: [CMD-SHELL, pg_isready -U ${POSTGRES_USER:-pos} -d ${POSTGRES_DB:-pos}]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pos-postgres-data:
