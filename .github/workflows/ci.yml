name: ci

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: gofmt -d apps/api/cmd apps/api/internal
      - run: go test ./...
        working-directory: apps/api
      - run: npm ci
      - run: npm --workspace apps/web run test:run
      - run: npm --workspace apps/web run build
      - run: npx --yes @redocly/cli lint packages/api-contract/openapi.yaml
      - run: docker compose config
