openapi: 3.1.0
info:
  title: AI Operational POS API
  version: 0.1.0
  license:
    name: Proprietary
    identifier: LicenseRef-UNLICENSED
  description: Phase 0 foundation contract with the backend voice transcription slice. Product, auth, sales, inventory, and intent handlers are not declared until implemented.
servers:
  - url: http://127.0.0.1:8080
security: []
paths:
  /health/live:
    get:
      operationId: getLiveHealth
      summary: Check whether the API process is running
      responses:
        '200':
          description: API process is live
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessHealth'
        '404':
          description: Route not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /health/ready:
    get:
      operationId: getReadyHealth
      summary: Check whether API dependencies are available
      responses:
        '200':
          description: API and configured dependencies are ready
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadyHealth'
        '503':
          description: A dependency is unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Route not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/ping:
    get:
      operationId: pingApi
      summary: Verify the versioned API router
      responses:
        '200':
          description: Versioned API responds
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessPing'
        '404':
          description: Route not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/assistant/transcriptions:
    post:
      operationId: createAssistantTranscription
      summary: Transcribe an uploaded audio clip
      description: Transcribes audio in memory through the configured speech-to-text provider. Audio is not persisted.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TranscriptionRequest'
      responses:
        '200':
          description: Audio was transcribed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessTranscription'
        '400':
          description: The multipart request or duration field is invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '413':
          description: The audio exceeds the request size or duration limit
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '415':
          description: The audio MIME type or extension is unsupported
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '502':
          description: The transcription provider failed or returned an invalid response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/uploads:
    post:
      operationId: uploadImage
      summary: Upload a product image
      description: Uploads a WebP, PNG, or JPEG product image and stores it on disk.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: Product image file (webp, png, jpeg).
      responses:
        '201':
          description: Image uploaded successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessUpload'
        '400':
          description: Missing file or file too large
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Unsupported file format
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/products:
    get:
      operationId: listProducts
      summary: List all active products
      description: Returns all active products in the catalog ordered alphabetically by name.
      responses:
        '200':
          description: List of active products
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessProductList'
        '404':
          description: Route not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal database error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      operationId: createProduct
      summary: Create a new product in the catalog
      description: Validates and creates a new product with unique SKU and non-negative pricing.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProductRequest'
      responses:
        '201':
          description: Product successfully created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessProductCreated'
        '400':
          description: Validation error in request body
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Product with this SKU already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Voice transcription is disabled or not configured
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/inventory/locations:
    get:
      operationId: listInventoryLocations
      summary: List all active inventory locations
      description: Returns active storage locations (e.g., Toko Utama, Gudang).
      responses:
        '200':
          description: List of inventory locations
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessLocationList'
        '404':
          description: Route not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal database error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/inventory/stocks:
    get:
      operationId: listStocks
      summary: List current stock balances
      description: Returns stock balances per product and inventory location.
      parameters:
        - name: location_id
          in: query
          required: false
          schema:
            type: string
          description: Optional filter by inventory location UUID.
      responses:
        '200':
          description: List of stock balances
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessStockList'
        '404':
          description: Route not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal database error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/inventory/movements:
    post:
      operationId: createStockMovement
      summary: Record an inventory stock movement
      description: Appends a stock movement entry and updates the product stock balance atomically.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecordMovementRequest'
      responses:
        '201':
          description: Stock movement recorded successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessMovementRecorded'
        '400':
          description: Invalid movement data or insufficient stock
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/orders:
    get:
      operationId: listOrders
      summary: List past orders
      description: Returns a list of orders optionally filtered by location.
      parameters:
        - name: location_id
          in: query
          required: false
          schema:
            type: string
          description: Optional filter by inventory location UUID.
      responses:
        '200':
          description: List of orders
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessOrderList'
        '404':
          description: Route not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      operationId: createOrder
      summary: Create and complete a POS order
      description: Persists order and items, deducts inventory stock atomically, and appends sale stock movement.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrderRequest'
      responses:
        '201':
          description: Order created and processed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessOrderDetail'
        '409':
          description: Insufficient inventory stock for order items
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validation error or insufficient payment amount
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/orders/{id}:
    get:
      operationId: getOrderById
      summary: Get order details and items
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Order UUID or human-readable order number.
      responses:
        '200':
          description: Detailed order with items
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessOrderDetail'
        '404':
          description: Order not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/auth/login:
    post:
      operationId: loginWithPassword
      summary: Login with email and password
      description: Verifies staff credentials with bcrypt and issues an opaque session token.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Authenticated session with user identity
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessAuth'
        '400':
          description: Email or password missing
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Invalid email or password
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/auth/pin:
    post:
      operationId: loginWithPin
      summary: Fast cashier terminal login with role and PIN
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PinLoginRequest'
      responses:
        '200':
          description: Authenticated session with user identity
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessAuth'
        '401':
          description: Invalid role or PIN
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Role or PIN payload invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/auth/me:
    get:
      operationId: getSessionUser
      summary: Resolve the current session token to a user
      parameters:
        - name: Authorization
          in: header
          required: true
          schema:
            type: string
          description: Bearer opaque session token.
      responses:
        '200':
          description: Session user with role and permissions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessAuthUser'
        '401':
          description: Missing, revoked, or expired session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/auth/logout:
    post:
      operationId: revokeSession
      summary: Revoke the current session token
      parameters:
        - name: Authorization
          in: header
          required: true
          schema:
            type: string
          description: Bearer opaque session token.
      responses:
        '200':
          description: Session revoked
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessLogout'
        '401':
          description: Missing or unknown session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/categories:
    get:
      operationId: listCategories
      summary: List active product categories for the tenant
      responses:
        '200':
          description: Tenant category list ordered by name
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessCategoryList'
        '404':
          description: Route not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      operationId: createCategory
      summary: Create a product category
      description: Category names are unique per tenant (case-insensitive).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCategoryRequest'
      responses:
        '201':
          description: Category created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessCategoryCreated'
        '400':
          description: Category name missing or invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Category name already exists for the tenant
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/customers:
    get:
      operationId: listCustomers
      summary: List active customers for the tenant
      parameters:
        - name: search
          in: query
          required: false
          schema:
            type: string
          description: Filter by name, phone, or email (case-insensitive).
      responses:
        '200':
          description: Tenant customer list ordered by name
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessCustomerList'
        '404':
          description: Route not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      operationId: createCustomer
      summary: Register a new customer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpsertCustomerRequest'
      responses:
        '201':
          description: Customer created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessCustomer'
        '400':
          description: Customer name missing or invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/customers/{id}:
    get:
      operationId: getCustomerById
      summary: Get a customer by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Customer detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessCustomer'
        '404':
          description: Customer not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    put:
      operationId: updateCustomer
      summary: Update a customer
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpsertCustomerRequest'
      responses:
        '200':
          description: Customer updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessCustomer'
        '400':
          description: Payload invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Customer not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/pets:
    get:
      operationId: listPets
      summary: List active pets for the tenant
      parameters:
        - name: customer_id
          in: query
          required: false
          schema:
            type: string
          description: Filter by owner customer ID.
      responses:
        '200':
          description: Tenant pet list ordered by name
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessPetList'
        '404':
          description: Route not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      operationId: createPet
      summary: Register a new pet for a customer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpsertPetRequest'
      responses:
        '201':
          description: Pet created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessPet'
        '422':
          description: Payload invalid or owner not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/pets/{id}:
    get:
      operationId: getPetById
      summary: Get a pet by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Pet detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessPet'
        '404':
          description: Pet not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    put:
      operationId: updatePet
      summary: Update a pet
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpsertPetRequest'
      responses:
        '200':
          description: Pet updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessPet'
        '404':
          description: Pet not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Payload invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/services:
    get:
      operationId: listServices
      summary: List active services for the tenant
      parameters:
        - name: category
          in: query
          required: false
          schema:
            type: string
            enum: [grooming, klinik, penitipan, lainnya]
      responses:
        '200':
          description: Tenant service list ordered by name
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessServiceList'
        '404':
          description: Route not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      operationId: createService
      summary: Register a new service
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpsertServiceRequest'
      responses:
        '201':
          description: Service created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessService'
        '400':
          description: Payload invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Service name already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/services/{id}:
    get:
      operationId: getServiceById
      summary: Get a service by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Service detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessService'
        '404':
          description: Service not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    put:
      operationId: updateService
      summary: Update a service
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpsertServiceRequest'
      responses:
        '200':
          description: Service updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessService'
        '400':
          description: Payload invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Service not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/packages:
    get:
      operationId: listPackages
      summary: List active service packages for the tenant
      responses:
        '200':
          description: Tenant package list ordered by name
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessPackageList'
        '404':
          description: Route not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      operationId: createPackage
      summary: Create a service bundle package
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpsertPackageRequest'
      responses:
        '201':
          description: Package created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessPackage'
        '409':
          description: Package name already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Payload invalid or service not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/packages/{id}:
    get:
      operationId: getPackageById
      summary: Get a package by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Package detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessPackage'
        '404':
          description: Package not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    put:
      operationId: updatePackage
      summary: Update a package
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpsertPackageRequest'
      responses:
        '200':
          description: Package updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessPackage'
        '404':
          description: Package not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Payload invalid or service not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/bookings:
    get:
      operationId: listBookings
      summary: List bookings for the tenant
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [antre, proses, selesai, batal]
        - name: date
          in: query
          required: false
          schema:
            type: string
            format: date
          description: Filter by scheduled date (YYYY-MM-DD).
      responses:
        '200':
          description: Booking list ordered by schedule
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessBookingList'
        '404':
          description: Route not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      operationId: createBooking
      summary: Schedule a new booking for exactly one service or package
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpsertBookingRequest'
      responses:
        '201':
          description: Booking created in antre status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessBooking'
        '422':
          description: Payload invalid or reference not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/bookings/{id}:
    get:
      operationId: getBookingById
      summary: Get a booking by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Booking detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessBooking'
        '404':
          description: Booking not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/bookings/{id}/status:
    post:
      operationId: changeBookingStatus
      summary: Move a booking to proses or batal
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BookingStatusRequest'
      responses:
        '200':
          description: Booking status updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessBooking'
        '404':
          description: Booking not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Booking already closed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Transition invalid (selesai requires payment)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/bookings/{id}/complete:
    post:
      operationId: completeBooking
      summary: Settle a booking into a POS order with jasa lines
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompleteBookingRequest'
      responses:
        '200':
          description: Booking settled with linked order
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessBookingCompleted'
        '404':
          description: Booking not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Booking already closed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Payment or reference invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/promos:
    get:
      operationId: listPromos
      summary: List all promos and vouchers for the current tenant
      responses:
        '200':
          description: List of promos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessPromoList'
        '404':
          description: Route not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      operationId: createPromo
      summary: Create a new promo code or voucher
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpsertPromoRequest'
      responses:
        '201':
          description: Promo created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessPromo'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Duplicate promo code
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/promos/{id}:
    get:
      operationId: getPromoById
      summary: Get promo details by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Promo details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessPromo'
        '404':
          description: Promo not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    put:
      operationId: updatePromo
      summary: Update promo details by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpsertPromoRequest'
      responses:
        '200':
          description: Promo updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessPromo'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Promo not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Duplicate promo code
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      operationId: deletePromo
      summary: Delete a promo code
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Promo deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                  request_id:
                    type: string
        '404':
          description: Promo not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/promos/validate:
    post:
      operationId: validatePromo
      summary: Validate a promo code against a cart subtotal
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ValidatePromoRequest'
      responses:
        '200':
          description: Promo is valid and discount calculated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessPromoValidation'
        '400':
          description: Promo invalid, inactive, expired, or min spend not met
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Promo code not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
components:
  schemas:
    SuccessHealth:
      type: object
      required: [data, request_id]
      properties:
        data:
          type: object
          required: [status]
          properties:
            status:
              type: string
              const: ok
        request_id:
          type: string
    ReadyHealth:
      type: object
      required: [data, request_id]
      properties:
        data:
          type: object
          required: [status, dependencies]
          properties:
            status:
              type: string
              const: ready
            dependencies:
              type: object
              required: [database]
              properties:
                database:
                  type: string
                  const: ok
        request_id:
          type: string
    SuccessPing:
      type: object
      required: [data, request_id]
      properties:
        data:
          type: object
          required: [service, status]
          properties:
            service:
              type: string
              const: api
            status:
              type: string
              const: ok
        request_id:
          type: string
    TranscriptionRequest:
      type: object
      required: [file]
      properties:
        file:
          type: string
          format: binary
          description: Audio file with a supported extension and matching MIME type.
        duration_seconds:
          type: number
          format: double
          minimum: 0
          description: Optional client-observed duration used for an early duration-limit check.
    SuccessTranscription:
      type: object
      required: [data, request_id]
      properties:
        data:
          type: object
          required: [text, provider, model]
          properties:
            text:
              type: string
            provider:
              type: string
              const: groq
            model:
              type: string
              description: Configured speech-to-text model identifier.
        request_id:
          type: string
    ErrorResponse:
      type: object
      required: [error, request_id]
      properties:
        error:
          $ref: '#/components/schemas/ErrorBody'
        request_id:
          type: string
    ErrorBody:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string
        details:
          description: Optional machine-readable context for the error.
    Product:
      type: object
      required: [id, sku, name, purchase_price_idr, selling_price_idr, base_unit, minimum_stock, is_active, created_at, updated_at]
      properties:
        id:
          type: string
          description: Unique product identifier (UUID).
        category_id:
          type: [string, "null"]
          description: Associated category UUID if any.
        sku:
          type: string
          description: Stock keeping unit code.
        name:
          type: string
          description: Display name of the product.
        purchase_price_idr:
          type: integer
          minimum: 0
          description: Purchase/cost price in Rupiah.
        selling_price_idr:
          type: integer
          minimum: 0
          description: Retail selling price in Rupiah.
        base_unit:
          type: string
          description: Unit of measure (e.g. pcs, porsi, cup, kg).
        minimum_stock:
          type: number
          minimum: 0
          description: Threshold for minimum inventory alerts.
        image_url:
          type: [string, "null"]
          description: Optional URL of product image.
        is_active:
          type: boolean
          description: Product availability status.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    CreateProductRequest:
      type: object
      required: [sku, name, purchase_price_idr, selling_price_idr, base_unit]
      properties:
        category_id:
          type: [string, "null"]
          description: Optional category UUID.
        sku:
          type: string
          minLength: 1
          description: Unique SKU identifier.
        name:
          type: string
          minLength: 1
          description: Product name.
        purchase_price_idr:
          type: integer
          minimum: 0
          description: Cost price in Rupiah.
        selling_price_idr:
          type: integer
          minimum: 0
          description: Selling price in Rupiah.
        base_unit:
          type: string
          minLength: 1
          description: Unit of measurement (e.g. pcs, cup, box).
        minimum_stock:
          type: number
          minimum: 0
          default: 0
          description: Minimum stock threshold.
        image_url:
          type: [string, "null"]
          description: Optional URL of uploaded product image.
    SuccessProductList:
      type: object
      required: [data, request_id]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Product'
        request_id:
          type: string
    SuccessProductCreated:
      type: object
      required: [data, request_id]
      properties:
        data:
          $ref: '#/components/schemas/Product'
        request_id:
          type: string
    InventoryLocation:
      type: object
      required: [id, name, code, is_active, created_at]
      properties:
        id:
          type: string
        name:
          type: string
        code:
          type: string
        is_active:
          type: boolean
        created_at:
          type: string
          format: date-time
    ProductStockSummary:
      type: object
      required: [product_id, sku, product_name, base_unit, minimum_stock, location_id, location_name, quantity, updated_at]
